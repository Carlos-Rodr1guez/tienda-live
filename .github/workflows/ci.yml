name: CI

on:
  push:
    branches: [main]
  pull_request:

# La CI solo necesita leer el código.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Las acciones van fijadas por SHA, con la versión al lado; Dependabot las actualiza.
jobs:
  calidad:
    name: Lint, formato, tipos y licencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run licenses
      - name: Vulnerabilidades altas en dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      # Las dos comprobaciones siguientes son locales: no suben nada ni necesitan credenciales de Cloudflare.
      - name: El paquete del Worker solo tiene código propio
        run: npm run check:bundle -w @tienda/api
      - name: Humo de D1 - las migraciones corren en SQLite real (workerd)
        run: npm run db:migrate -w @tienda/api

  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Entorno de la construcción de la web. Las pruebas de dist leen SITE_URL y esperan este origen.
    # El sitekey es el de PRUEBA de Turnstile (siempre aprueba). No hay token del beacon: la CI no lleva analítica.
    # El estado de las herramientas (Astro, Wrangler) queda dentro del runner, no en la carpeta de usuario.
    env:
      SITE_URL: http://localhost:8790
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TIENDA_DEV_STATE: ${{ runner.temp }}/tienda-dev-state
    strategy:
      fail-fast: false
      matrix:
        # Windows porque ahí transmite la mayoría de los streamers
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # La vitrina: tipos, construcción real, pruebas sobre el HTML construido y el esquema de contenido.
      - name: Tipos de la web (astro check)
        run: npm run typecheck -w @tienda/web
      - name: Construcción de la web
        run: npm run build -w @tienda/web
      - name: Pruebas del dist (HTML, cabeceras, imágenes y presupuesto de JS)
        run: npm run test:dist -w @tienda/web
      - name: El esquema rechaza contenido inválido y nombra archivo y campo
        run: npm run check:schema -w @tienda/web
