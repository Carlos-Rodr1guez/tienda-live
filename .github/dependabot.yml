version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # ESLint, Prettier y TypeScript llegan juntos en un solo pull request
      herramientas:
        dependency-type: development
    ignore:
      # La raíz usa TypeScript 7 y apps/web usa TypeScript 6 para astro check (ADR-009).
      # Un salto de versión mayor lo decidimos a mano, no con un pull request automático.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
